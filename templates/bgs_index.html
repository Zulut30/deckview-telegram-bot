<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlegrounds Strategy Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .board {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            min-height: 200px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
        }
        .slot {
            width: 140px;
            height: 190px;
            border: 2px dashed #555;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background-size: cover;
            position: relative;
        }
        .slot:hover { border-color: #aaa; }
        .slot img { width: 100%; height: auto; }

        .hero-picker {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .hero-slot {
            width: 180px;
            height: 240px;
            border: 2px solid #edc233;
            border-radius: 15px;
            background-size: cover;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }
        .modal-content {
            background: #222;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-height: 80%;
            overflow-y: auto;
            border-radius: 10px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }
        .card-item {
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-item:hover { transform: scale(1.1); }
        .card-item img { width: 100%; }

        .controls {
            text-align: center;
            margin: 20px;
        }
        .gen-btn {
            background: #edc233;
            color: #000;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .gen-btn:hover { background: #f5d76e; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BGS Strategy Builder</h1>
            <p>Соберите идеальный стол для Полей Сражений</p>
        </header>

        <main>
            <div class="hero-picker">
                <div class="hero-slot" id="heroSlot" onclick="openPicker('hero')" title="Выбрать героя">
                    <img id="heroImg" src="" style="display:none">
                    <div id="heroPlaceholder" style="text-align:center; padding-top:100px; color:#aaa">Герой</div>
                </div>
            </div>

            <div class="board">
                {% for i in range(7) %}
                <div class="slot" id="slot{{i}}" onclick="openPicker({{i}})" title="Выбрать существо">
                    <div id="placeholder{{i}}" style="color:#555">+</div>
                </div>
                {% endfor %}
            </div>

            <div class="controls">
                <button class="gen-btn" onclick="generateImage()">Сгенерировать изображение</button>
            </div>

            <div id="resultArea" class="hidden">
                 <img id="finalImage" src="" style="width:100%; margin-top:20px; border-radius:10px;">
            </div>
        </main>
    </div>

    <!-- Modal for picking cards -->
    <div id="pickerModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Выберите карту</h2>
            <div class="card-grid" id="cardGrid">
                <!-- Cards will be loaded here -->
            </div>
            <button onclick="closeModal()" style="margin-top:20px; padding:10px;">Закрыть</button>
        </div>
    </div>

    <script>
        let currentTarget = null;
        let selectedHero = null;
        let selectedBoard = [null, null, null, null, null, null, null];

        const heroes = {{ heroes|tojson }};
        const minions = {{ minions|tojson }};

        function openPicker(target) {
            currentTarget = target;
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            const list = (target === 'hero') ? heroes : minions;

            list.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-item';
                div.innerHTML = `<img src="${card.image}" alt="${card.name}">`;
                div.onclick = () => selectCard(card);
                grid.appendChild(div);
            });

            document.getElementById('pickerModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('pickerModal').style.display = 'none';
        }

        function selectCard(card) {
            if (currentTarget === 'hero') {
                selectedHero = card;
                const slot = document.getElementById('heroSlot');
                slot.style.backgroundImage = `url(${card.image})`;
                document.getElementById('heroPlaceholder').style.display = 'none';
            } else {
                selectedBoard[currentTarget] = card;
                const slot = document.getElementById(`slot${currentTarget}`);
                slot.innerHTML = `<img src="${card.image}">`;
            }
            closeModal();
        }

        async function generateImage() {
            if (!selectedHero) {
                alert("Выберите героя!");
                return;
            }

            const payload = {
                hero_id: selectedHero.id,
                minions: selectedBoard.map(m => m ? m.id : null)
            };

            const btn = document.querySelector('.gen-btn');
            btn.disabled = true;
            btn.innerText = 'Генерация...';

            try {
                const resp = await fetch('/bgs/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.success) {
                    const resultImg = document.getElementById('finalImage');
                    resultImg.src = data.image_url;
                    document.getElementById('resultArea').classList.remove('hidden');
                } else {
                    alert("Ошибка: " + data.error);
                }
            } catch (e) {
                alert("Ошибка сети");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Сгенерировать изображение';
            }
        }
    </script>
</body>
</html>
