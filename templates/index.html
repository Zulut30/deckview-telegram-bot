<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>DeckView — Визуализатор колод Hearthstone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #080C14;
      --surface:  #0E1420;
      --card:     #131B2E;
      --border:   #1E2A42;
      --text:     #E8EDF5;
      --muted:    #5A6B8A;
      --gold:     #C89B3C;
      --gold-lt:  #E8C06A;
      --gold-bg:  rgba(200,155,60,.10);
      --red:      #E53E3E;
      --green:    #38A169;
      --blue:     #3B82F6;
      --r:        12px;
      --font:     'Inter', system-ui, sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;
         background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(200,155,60,.08) 0%,transparent 70%);}

    /* ── Nav ── */
    nav{position:sticky;top:0;z-index:50;background:rgba(8,12,20,.9);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;
        justify-content:space-between;height:58px;}
    .nav-logo{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--gold);}
    .nav-logo span{color:var(--text);font-weight:400;}
    .nav-links{display:flex;gap:6px;}
    .nav-link{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);
               text-decoration:none;transition:color .15s,background .15s;}
    .nav-link:hover{color:var(--text);background:rgba(255,255,255,.05);}
    .nav-tg{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;
             background:var(--gold-bg);color:var(--gold);border:1px solid rgba(200,155,60,.25);
             text-decoration:none;transition:background .15s;}
    .nav-tg:hover{background:rgba(200,155,60,.18);}

    /* ── Main split layout ── */
    .main-layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 58px);}

    /* ── Left panel ── */
    .left-panel{border-right:1px solid var(--border);padding:40px 32px;display:flex;
                flex-direction:column;gap:24px;position:sticky;top:58px;
                height:calc(100vh - 58px);overflow-y:auto;}

    .panel-title{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;}
    .panel-title .accent{background:linear-gradient(135deg,var(--gold-lt),var(--gold));
                          -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .panel-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-top:4px;}

    /* ── Form ── */
    .inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;
         padding:12px 16px;font-size:14px;color:var(--text);font-family:var(--font);
         outline:none;transition:border-color .15s,box-shadow .15s;}
    .inp::placeholder{color:var(--muted);}
    .inp:focus{border-color:rgba(200,155,60,.5);box-shadow:0 0 0 3px rgba(200,155,60,.08);}
    .inp-row{display:flex;gap:8px;}
    .paste-btn{padding:12px 14px;background:var(--surface);border:1px solid var(--border);
               border-radius:10px;color:var(--muted);cursor:pointer;font-size:15px;flex-shrink:0;
               transition:color .15s,border-color .15s;}
    .paste-btn:hover{color:var(--text);border-color:rgba(200,155,60,.4);}
    .gen-btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
             font-size:15px;font-weight:700;font-family:var(--font);
             background:linear-gradient(135deg,#C89B3C,#A67C26);color:#080C14;
             transition:opacity .15s,transform .1s;margin-top:4px;}
    .gen-btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);}
    .gen-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
    .form-hint{font-size:12px;color:var(--muted);}
    .form-fields{display:flex;flex-direction:column;gap:10px;}

    /* ── Error ── */
    .error-box{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;
               background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.3);
               border-radius:10px;font-size:13px;color:#FCA5A5;}
    .error-box .ico{font-size:15px;flex-shrink:0;margin-top:1px;}

    /* ── Meta chips ── */
    .meta-row{display:flex;gap:6px;flex-wrap:wrap;}
    .meta-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
               font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);}
    .meta-chip.gold{background:var(--gold-bg);border-color:rgba(200,155,60,.3);color:var(--gold-lt);}
    .meta-chip.blue{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93C5FD;}
    .meta-chip.green{background:rgba(56,161,105,.1);border-color:rgba(56,161,105,.3);color:#68D391;}
    .meta-chip.muted{color:var(--muted);}

    /* ── Result actions ── */
    .actions{display:flex;flex-direction:column;gap:8px;}
    .action-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;
                border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
                border:1px solid var(--border);background:var(--card);color:var(--text);
                text-decoration:none;transition:border-color .15s,background .15s;font-family:var(--font);}
    .action-btn:hover{border-color:rgba(200,155,60,.4);background:var(--gold-bg);}
    .action-btn.primary{background:var(--gold-bg);border-color:rgba(200,155,60,.35);color:var(--gold-lt);}
    .action-btn.reset{color:var(--muted);font-size:13px;}

    /* ── Loader ── */
    .loader{display:flex;flex-direction:column;gap:12px;}
    .loader-ring{width:40px;height:40px;border:3px solid var(--border);
                 border-top-color:var(--gold);border-radius:50%;
                 animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loader-steps{display:flex;flex-direction:column;gap:6px;}
    .loader-step{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 14px;
                 border-radius:8px;background:var(--surface);border:1px solid var(--border);
                 transition:border-color .3s,color .3s;}
    .loader-step.active{border-color:var(--gold);color:var(--gold-lt);}
    .loader-step.done{border-color:rgba(56,161,105,.4);color:#68D391;}
    .step-icon{font-size:13px;width:18px;text-align:center;}
    .progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));
                   border-radius:2px;transition:width .4s ease;}
    .progress-pct{font-size:11px;color:var(--muted);}

    /* ── Right panel ── */
    .right-panel{padding:40px 40px;display:flex;flex-direction:column;justify-content:flex-start;gap:32px;}

    /* ── Image placeholder ── */
    .img-placeholder{border:2px dashed var(--border);border-radius:16px;
                     display:flex;flex-direction:column;align-items:center;justify-content:center;
                     padding:80px 40px;gap:16px;text-align:center;
                     background:rgba(14,20,32,.4);min-height:400px;}
    .img-placeholder .ph-ico{font-size:52px;opacity:.3;}
    .img-placeholder .ph-title{font-size:16px;font-weight:600;color:var(--muted);}
    .img-placeholder .ph-sub{font-size:13px;color:var(--muted);opacity:.7;max-width:280px;line-height:1.6;}

    /* ── Deck image ── */
    .deck-img-frame{border-radius:16px;overflow:hidden;border:2px solid var(--border);
                    box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 1px rgba(200,155,60,.08);}
    .deck-img-frame img{display:block;width:100%;height:auto;}
    .result-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
                  letter-spacing:.06em;display:flex;align-items:center;gap:8px;}
    .result-label::before,.result-label::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── Recent ── */
    .recent-section{padding:0 40px 48px;}
    .section-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;}
    .section-hd h2{font-size:17px;font-weight:700;}
    .section-hd .cnt{font-size:13px;color:var(--muted);}
    .recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
    .recent-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
                 overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;}
    .recent-card:hover{border-color:rgba(200,155,60,.4);transform:translateY(-3px);
                       box-shadow:0 8px 30px rgba(0,0,0,.4);}
    .recent-card img{display:block;width:100%;height:auto;}
    .recent-card-info{padding:8px 12px;}
    .recent-card-class{font-size:12px;font-weight:600;color:var(--gold);}
    .recent-card-cost{font-size:11px;color:var(--muted);margin-top:2px;}
    .recent-empty{text-align:center;padding:40px 24px;color:var(--muted);font-size:14px;
                  border:1px dashed var(--border);border-radius:12px;}

    /* ── Footer ── */
    footer{border-top:1px solid var(--border);padding:24px;text-align:center;
           font-size:12px;color:var(--muted);}
    footer a{color:var(--muted);text-decoration:none;}
    footer a:hover{color:var(--gold);}

    /* ── Responsive ── */
    @media(max-width:900px){
      .main-layout{grid-template-columns:1fr;}
      .left-panel{position:static;height:auto;border-right:none;
                  border-bottom:1px solid var(--border);padding:28px 20px;}
      .right-panel{padding:28px 20px;}
      .recent-section{padding:0 20px 40px;}
    }
    @media(max-width:600px){
      nav{padding:0 16px;}
      .nav-links{display:none;}
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">Deck<span>View</span></div>
  <div class="nav-links">
    <a href="/" class="nav-link">Главная</a>
    <a href="/bgs" class="nav-link">Battlegrounds</a>
    <a href="/admin" class="nav-link">Админ</a>
  </div>
  <a href="https://t.me/DeckviewBot" target="_blank" class="nav-tg">✦ Telegram-бот</a>
</nav>

<div id="app"></div>

{% raw %}<script type="module">
import { h, render } from 'https://esm.sh/preact@10.22.0';
import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.22.0/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ── Utilities ─────────────────────────────────────────────
function fmtCost(n){return n==null?'—':Number(n).toLocaleString('ru-RU')+' 💨';}

const STEPS = [
  {id:'fetch',  label:'Получение данных колоды…',   icon:'🔍'},
  {id:'cards',  label:'Загрузка изображений карт…', icon:'🃏'},
  {id:'build',  label:'Сборка изображения…',         icon:'🎨'},
  {id:'save',   label:'Сохранение результата…',      icon:'💾'},
];

// ── Left panel: Loader state ───────────────────────────────
function LoaderPanel({progress}){
  const stepIndex = Math.min(Math.floor(progress / 25), 3);
  return html`
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-steps">
        ${STEPS.map((s,i)=>html`
          <div class=${'loader-step'+(i<stepIndex?' done':i===stepIndex?' active':'')} key=${s.id}>
            <span class="step-icon">${i<stepIndex?'✓':i===stepIndex?'⟳':s.icon}</span>
            <span>${s.label}</span>
          </div>`)}
      </div>
      <div class="progress-track">
        <div class="progress-fill" style=${{width:progress+'%'}}></div>
      </div>
      <div class="progress-pct">${progress}% завершено</div>
    </div>`;
}

// ── Left panel: Result meta + actions ─────────────────────
function ResultPanel({result, deckCode, onReset}){
  const [copied, setCopied] = useState(false);

  const copy = () => {
    navigator.clipboard.writeText(deckCode).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false),2000);
    });
  };

  const modeColor = result.deck_mode==='Стандарт'?'blue':result.deck_mode==='Вольный'?'green':'';

  return html`
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--gold-lt);margin-bottom:10px;">
          ✦ Колода сгенерирована
        </div>
        <div class="meta-row">
          ${result.deck_class&&html`<span class="meta-chip gold">🛡 ${result.deck_class}</span>`}
          ${result.deck_mode&&html`<span class=${'meta-chip '+(modeColor||'')}>${result.deck_mode}</span>`}
          <span class="meta-chip">💨 ${fmtCost(result.cost)}</span>
          ${result.cached&&html`<span class="meta-chip muted">⚡ Из кэша</span>`}
        </div>
      </div>

      <div class="actions">
        <button class="action-btn primary" onclick=${copy}>
          ${copied?'✓ Скопировано':'⎘ Скопировать код колоды'}
        </button>
        <a href=${result.image_url} download="deck.jpg" class="action-btn">
          ↓ Скачать JPEG
        </a>
        <button class="action-btn reset" onclick=${onReset}>
          + Сгенерировать ещё одну колоду
        </button>
      </div>
    </div>`;
}

// ── Left panel: Form ──────────────────────────────────────
function FormPanel({onResult, onLoading, onIdle, loading, progress}){
  const [code, setCode] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  const progressRef = useRef(null);

  const startProgress = () => {
    onLoading(0);
    let p = 0;
    const tick = () => {
      p += Math.random() * 3 + 0.5;
      if(p >= 88){ onLoading(88); return; }
      onLoading(Math.round(p));
      progressRef.current = setTimeout(tick, 700);
    };
    progressRef.current = setTimeout(tick, 500);
  };

  const stopProgress = (final=100) => {
    if(progressRef.current) clearTimeout(progressRef.current);
    onLoading(final);
  };

  const paste = async () => {
    try{const t=await navigator.clipboard.readText();setCode(t.trim());}
    catch(e){console.warn('clipboard',e);}
  };

  const submit = async (e) => {
    e && e.preventDefault();
    if(!code.trim()){setError('Введите код колоды (начинается с AA).');return;}
    setError('');
    startProgress();

    try{
      const r = await fetch('/api/v1/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({deck_code:code.trim(),deck_name:name.trim()||null}),
      });
      const d = await r.json();
      stopProgress(d.success?100:88);
      if(d.success){ setTimeout(()=>onResult(d,code.trim()),300); }
      else{ setError(d.error||'Неизвестная ошибка'); onIdle(); }
    }catch(err){
      stopProgress(0);
      setError('Ошибка сети: '+err.message);
      onIdle();
    }
  };

  return html`
    <div style="display:flex;flex-direction:column;gap:16px;">
      ${error&&html`
        <div class="error-box">
          <span class="ico">⚠</span>
          <span>${error}</span>
        </div>`}
      <form onsubmit=${submit} style="display:flex;flex-direction:column;gap:10px;">
        <div class="inp-row">
          <input class="inp" type="text" placeholder="Код колоды (AAECAf…)"
            value=${code} onInput=${e=>setCode(e.target.value)}
            autocomplete="off" spellcheck="false" disabled=${loading}/>
          <button type="button" class="paste-btn" onclick=${paste} title="Вставить из буфера" disabled=${loading}>⎘</button>
        </div>
        <input class="inp" type="text" placeholder="Название колоды (опционально)"
          value=${name} onInput=${e=>setName(e.target.value)} disabled=${loading}/>
        <button type="submit" class="gen-btn" disabled=${!code.trim()||loading}>
          ${loading?'Генерируется…':'Сгенерировать изображение'}
        </button>
      </form>
      <div class="form-hint">Вставьте код из Hearthstone · Стандарт, Вольный, Классический</div>
    </div>`;
}

// ── Right panel: Image placeholder ────────────────────────
function Placeholder(){
  return html`
    <div class="img-placeholder">
      <div class="ph-ico">🃏</div>
      <div class="ph-title">Здесь появится ваша колода</div>
      <div class="ph-sub">Введите код колоды слева и нажмите «Сгенерировать» — получите красивое изображение с составом и стоимостью пыли.</div>
    </div>`;
}

// ── Right panel: Deck image ────────────────────────────────
function DeckImage({imageUrl}){
  return html`
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="result-label">Изображение колоды</div>
      <div class="deck-img-frame">
        <img src=${imageUrl} alt="Deck" loading="lazy"/>
      </div>
    </div>`;
}

// ── Recent decks (below right panel) ──────────────────────
function Recent(){
  const [items, setItems] = useState(null);

  useEffect(()=>{
    fetch('/api/v1/recent').then(r=>r.json()).then(setItems).catch(()=>setItems([]));
  },[]);

  if(items===null||!items.length) return null;

  return html`
    <div class="recent-section">
      <div class="section-hd">
        <h2>Недавние колоды</h2>
        <span class="cnt">${items.length} шт.</span>
      </div>
      <div class="recent-grid">
        ${items.map(it=>html`
          <div class="recent-card" key=${it.id} onclick=${()=>window.open(it.image_url,'_blank')}>
            <img src=${it.image_url} alt=${it.deck_class||'Deck'} loading="lazy"/>
            <div class="recent-card-info">
              <div class="recent-card-class">${it.deck_class||'Неизвестный класс'}</div>
              <div class="recent-card-cost">${it.deck_mode||''} · ${fmtCost(it.cost)}</div>
            </div>
          </div>`)}
      </div>
    </div>`;
}

// ── App ───────────────────────────────────────────────────
function App(){
  const [result, setResult]   = useState(null);
  const [deckCode, setDeckCode] = useState('');
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleLoading = useCallback((p)=>{
    setLoading(true); setProgress(p);
  },[]);

  const handleIdle = useCallback(()=>{
    setLoading(false); setProgress(0);
  },[]);

  const handleResult = useCallback((data, code)=>{
    setResult(data); setDeckCode(code);
    setLoading(false); setProgress(100);
  },[]);

  const handleReset = useCallback(()=>{
    setResult(null); setDeckCode('');
    setLoading(false); setProgress(0);
  },[]);

  return html`
    <div>
      <div class="main-layout">
        <!-- LEFT PANEL -->
        <div class="left-panel">
          ${!result&&!loading&&html`
            <div>
              <div class="panel-title">Визуализатор<br/>колод <span class="accent">Hearthstone</span></div>
              <div class="panel-sub">Вставьте код колоды из игры — получите красивое изображение с составом, стоимостью пыли и классом героя.</div>
            </div>`}

          ${loading&&html`<${LoaderPanel} progress=${progress}/>`}

          ${result&&html`<${ResultPanel} result=${result} deckCode=${deckCode} onReset=${handleReset}/>`}

          ${!loading&&html`
            <${FormPanel}
              onResult=${handleResult}
              onLoading=${handleLoading}
              onIdle=${handleIdle}
              loading=${loading}
              progress=${progress}
            />`}
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
          ${result
            ? html`<${DeckImage} imageUrl=${result.image_url}/>`
            : html`<${Placeholder}/>`}
        </div>
      </div>

      <${Recent}/>

      <footer>
        <p>
          DeckView &copy; 2026 ·
          <a href="/admin">Панель администратора</a> ·
          <a href="https://t.me/DeckviewBot" target="_blank">Telegram-бот</a>
        </p>
      </footer>
    </div>`;
}

render(html`<${App}/>`, document.getElementById('app'));
</script>{% endraw %}
</body>
</html>
