[Service]
# Enable the native compositor while keeping the production Pillow fallback.
Environment="DECKVIEW_RUST_RENDER=1"
# Invalidate Pillow-era render and Telegram file_id cache entries on rollout.
Environment="DECKVIEW_RENDERER_VERSION=rust-v0.3.0"
# Bound every process: two web workers plus the RQ worker can run concurrently.
Environment="DECKVIEW_RUST_THREADS=4"
