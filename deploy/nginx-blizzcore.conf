# Nginx: blizzcore.ru → Deckview (Gunicorn на порту 5000)
# Установка:
#   sudo cp /home/ubuntu/Deckview/deploy/nginx-blizzcore.conf /etc/nginx/sites-available/blizzcore.ru
#   sudo ln -sf /etc/nginx/sites-available/blizzcore.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (после того как по 80 порту всё открывается):
#   sudo certbot --nginx -d blizzcore.ru -d www.blizzcore.ru

server {
    listen 80;
    listen [::]:80;
    server_name blizzcore.ru www.blizzcore.ru;

    client_max_body_size 10M;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/Deckview/static/;
    }
}
