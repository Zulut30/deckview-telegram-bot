[package]
name = "deckview_core"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "deckview_core"
crate-type = ["cdylib"]

[dependencies]
ab_glyph = "0.2.32"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon", "text"] }
pyo3 = { version = "0.29.1", features = ["extension-module"] }
rayon = "1.12.0"
