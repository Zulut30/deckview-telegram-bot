name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      render_regressions:
        description: Render and upload the 30/40-card Reno reference images
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 / architecture and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile packaged entrypoints
        run: python -m compileall -q deckview image_creator framework db main.py web_app.py deckview_worker.py
      - name: Run full test suite
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-ci.db
        run: python -m unittest discover -v
      - name: Smoke-test packaged and compatibility imports
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-imports.db
        run: python scripts/check_modular_imports.py

  reno-render:
    name: Optional visual Reno regression
    if: github.event_name == 'workflow_dispatch' && inputs.render_regressions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Render 30/40-card Reno fixtures
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-render.db
        run: python scripts/render_regression_decks.py --output-dir artifacts/reno-regression
      - name: Upload visual regression artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reno-regression-${{ github.sha }}
          path: artifacts/reno-regression/
          if-no-files-found: error
          retention-days: 14
