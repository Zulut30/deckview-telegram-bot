name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      render_regressions:
        description: Render and upload the 30/40-card Reno reference images
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-renderer:
    name: Rust renderer / format, lint, tests, wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Create isolated native test environment
        run: |
          python -m venv .native-venv
          .native-venv/bin/python -m pip install --disable-pip-version-check \
            -r requirements.txt maturin==1.14.1
      - name: Check Rust formatting
        working-directory: rust/deckview_core
        run: cargo fmt --check
      - name: Lint Rust targets
        working-directory: rust/deckview_core
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust crate
        working-directory: rust/deckview_core
        run: cargo test --all-features
      - name: Build native wheel
        working-directory: rust/deckview_core
        run: ../../.native-venv/bin/maturin build --release --locked --out ../../native-wheels
      - name: Install and smoke-test native wheel
        env:
          DECKVIEW_RUST_RENDER: "1"
          DECKVIEW_RUST_REQUIRED: "1"
          DECKVIEW_RUST_THREADS: "2"
        run: |
          .native-venv/bin/python -m pip install --force-reinstall native-wheels/*.whl
          .native-venv/bin/python -c "import deckview_core; print(deckview_core.renderer_info())"
          .native-venv/bin/python scripts/smoke_native_renderer.py
          .native-venv/bin/python -m unittest tests.test_native_renderer -v

  test:
    name: Python 3.11 / architecture and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile packaged entrypoints
        run: python -m compileall -q deckview image_creator framework db scripts tools
      - name: Run full test suite
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-ci.db
        run: python -m unittest discover -v
      - name: Smoke-test canonical package imports
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-imports.db
        run: python scripts/check_package_imports.py

  reno-render:
    name: Optional visual Reno regression
    if: github.event_name == 'workflow_dispatch' && inputs.render_regressions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Render 30/40-card Reno fixtures
        env:
          TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          BATTLE_NET_TOKEN: test-token
          DASHBOARD_SECRET: test-secret-for-ci
          WEB_DATABASE_PATH: ${{ runner.temp }}/deckview-render.db
        run: python scripts/render_regression_decks.py --output-dir artifacts/reno-regression
      - name: Upload visual regression artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reno-regression-${{ github.sha }}
          path: artifacts/reno-regression/
          if-no-files-found: error
          retention-days: 14
